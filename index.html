<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#4285F4">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">

<style>
  :root, :root[data-theme=light] { --blue:#4285F4; --red:#EA4335; --yellow:#FBBC05; --green:#34A853; --bg:#f1f3f4; --card:#fff; --text:#202124; --mute:#5f6368; --line:#dadce0; --hover:#fafafa; --evbg:#f8faff; --evhot:#fef7f6; }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme=light]):not([data-theme=dark]) { --bg:#202124; --card:#2d2e31; --text:#e8eaed; --mute:#9aa0a6; --line:#3c4043; --hover:#35363a; --evbg:#26303f; --evhot:#3b2a29; }
  }
  :root[data-theme=dark] { --bg:#202124; --card:#2d2e31; --text:#e8eaed; --mute:#9aa0a6; --line:#3c4043; --hover:#35363a; --evbg:#26303f; --evhot:#3b2a29; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:'Google Sans',Roboto,Arial,sans-serif; background:var(--bg); color:var(--text); }

  /* ---------- Asas (telefon / skrin kecil): susun menegak, halaman boleh skrol ---------- */
  header { display:flex; justify-content:space-between; align-items:center; padding:10px 12px; background:var(--card); border-bottom:1px solid var(--line); position:sticky; top:0; z-index:5; }
  #title { font-size:18px; font-weight:700; letter-spacing:.03em; }
  header small, .hs { display:none; }
  .hbtns { display:flex; align-items:center; gap:8px; }
  .btn { border:0; border-radius:18px; padding:8px 16px; font-size:14px; cursor:pointer; background:var(--blue); color:#fff; text-decoration:none; display:inline-block; font-family:inherit; min-height:36px; }
  .btn.red { background:var(--red); } .btn.green { background:var(--green); } .btn.ghost { background:var(--card); color:var(--blue); border:1px solid var(--line); }
  .btn.sm { padding:5px 12px; font-size:13px; min-height:32px; } .btn:disabled { opacity:.4; cursor:default; }
  #nav { position:fixed; left:0; right:0; bottom:0; z-index:6; display:flex; justify-content:space-around; background:var(--card); border-top:1px solid var(--line); padding:6px 4px calc(6px + env(safe-area-inset-bottom)); }
  .nv { flex:1; display:flex; flex-direction:column; align-items:center; gap:2px; padding:4px 2px; color:var(--text); text-decoration:none; font-size:10px; font-weight:600; letter-spacing:.04em; border-radius:12px; }
  .nv .ic { font-size:20px; line-height:1; }
  main { display:flex; flex-direction:column; gap:12px; padding:12px 12px 88px; }
  .left, .col { display:contents; }
  .s-act { order:1; } .s-imp { order:2; } .s-today { order:3; } .s-next { order:4; } .s-oth { order:5; } .s-more { order:6; }
  section { background:var(--card); border-radius:12px; padding:12px; box-shadow:0 1px 3px rgba(60,64,67,.25); border-top:4px solid var(--blue); min-width:0; display:flex; flex-direction:column; min-height:0; }
  section.act { border-top-color:var(--yellow); } section.imp { border-top-color:var(--red); } section.oth { border-top-color:var(--mute); } section.cal2 { border-top-color:var(--green); } section.more { border-top-color:var(--yellow); }
  h2 { font-size:13px; margin:0 0 10px; letter-spacing:.08em; color:var(--mute); display:flex; align-items:center; gap:8px; flex-wrap:wrap; flex:none; }
  h2 .sp { flex:1; } h2 .n { background:var(--bg); border-radius:10px; padding:1px 8px; font-size:12px; }
  .list { max-height:46vh; overflow:auto; }
  .carousel { display:flex; align-items:center; gap:8px; }
  .arr { width:40px; height:40px; border-radius:50%; border:1px solid var(--line); background:var(--card); font-size:20px; cursor:pointer; color:var(--blue); flex:none; }
  .arr:disabled { opacity:.3; cursor:default; }
  .mcard { flex:1; min-width:0; border:1px solid var(--line); border-left:5px solid var(--red); border-radius:10px; padding:14px 16px; cursor:pointer; }
  .mcard:hover, .mrow:hover, .arow:hover { background:var(--hover); }
  .mcard .from { font-weight:700; font-size:15px; } .mcard .subj { font-size:16px; margin:4px 0; font-weight:600; }
  .mcard .prev { color:var(--mute); font-size:13px; display:-webkit-box; -webkit-line-clamp:3; -webkit-box-orient:vertical; overflow:hidden; }
  .cnt { color:var(--mute); font-size:12px; }
  .foot { display:flex; justify-content:space-between; align-items:center; margin-top:8px; gap:8px; flex-wrap:wrap; flex:none; }
  .fbtns { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; flex:1 1 100%; margin-top:6px; }
  .ibtn { display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px; padding:8px 4px; min-height:56px; border:1px solid var(--line); border-radius:12px; background:var(--card); color:var(--blue); font-family:inherit; font-size:12px; font-weight:600; cursor:pointer; line-height:1.15; text-align:center; }
  .ibtn .ib { font-size:18px; line-height:1; }
  .fbtns.two { grid-template-columns:repeat(2,1fr); }
  .mcard.acard { border-left-color:var(--yellow); }
  .ibtn.ok { color:var(--green); }
  .ibtn.del { color:var(--red); background:var(--evhot); border-color:transparent; }
  .ibtn:active, .ibtn:hover { background:var(--hover); }
  .row { display:flex; justify-content:space-between; gap:10px; } .when { color:var(--mute); font-size:12px; white-space:nowrap; }
  .ell { white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .mrow { display:flex; gap:10px; padding:8px 6px; border-bottom:1px solid var(--bg); cursor:pointer; align-items:flex-start; touch-action:pan-y; user-select:none; -webkit-user-select:none; position:relative; background:var(--card); }
  .mrow .b { flex:1; min-width:0; } .mrow.read .from, .mrow.read .subj, .arow.read .from, .arow.read .subj { font-weight:400; }
  .qd { flex:none; align-self:center; width:36px; height:36px; display:flex; align-items:center; justify-content:center; border:1px solid var(--line); border-radius:50%; background:var(--evhot); color:var(--red); cursor:pointer; padding:0; }
  .qd:hover, .qd:active { background:var(--red); color:#fff; border-color:var(--red); }
  .qd svg { width:18px; height:18px; fill:currentColor; pointer-events:none; }
  .from, .subj { font-weight:600; } .prev { color:var(--mute); font-size:12px; }
  .arow { border:1px solid var(--line); border-left:5px solid var(--yellow); border-radius:10px; padding:10px 12px; margin-bottom:8px; cursor:pointer; }
  .abtn { display:flex; gap:6px; margin-top:8px; flex-wrap:wrap; }
  .ev { padding:8px 10px; border-left:4px solid var(--blue); background:var(--evbg); border-radius:6px; margin-bottom:6px; cursor:pointer; }
  .ev.imp { border-left-color:var(--red); background:var(--evhot); } .ev.NO { border-left-color:var(--red); opacity:.75; } .ev.MAYBE { border-left-color:var(--yellow); }
  .ev.over { opacity:.65; } .evdone { font-size:12px; color:var(--green); font-weight:600; margin-top:2px; }
  .ev .t { font-weight:600; }
  .tag { font-size:11px; padding:1px 7px; border-radius:9px; color:#fff; margin-left:6px; }
  .tag.YES,.tag.OWNER { background:var(--green); } .tag.NO { background:var(--red); } .tag.MAYBE { background:var(--yellow); color:#000; } .tag.INVITED { background:var(--mute); }
  .empty { color:var(--mute); font-size:13px; padding:4px 2px; }
  #ov { display:none; position:fixed; inset:0; background:rgba(0,0,0,.55); z-index:20; align-items:flex-end; justify-content:center; padding:0; }
  #modal { background:var(--card); border-radius:16px 16px 0 0; max-width:880px; width:100%; max-height:92vh; overflow:auto; padding:16px; }
  #modal h3 { margin:0 0 8px; } .meta { color:var(--mute); font-size:13px; margin-bottom:12px; line-height:1.6; }
  pre { white-space:pre-wrap; word-wrap:break-word; font-family:inherit; font-size:14px; background:var(--bg); padding:12px; border-radius:8px; margin:0 0 14px; }
  .actions { display:flex; gap:8px; flex-wrap:wrap; } .actions .btn { flex:1 1 45%; text-align:center; }
  .mframe { width:100%; height:48vh; border:1px solid var(--line); border-radius:8px; background:#fff; margin-bottom:14px; }
  .lbl { display:block; font-size:12px; color:var(--mute); margin:12px 0 4px; font-weight:600; }
  textarea, input[type=number] { width:100%; font-family:inherit; font-size:14px; padding:8px; border:1px solid var(--line); border-radius:8px; background:var(--card); color:var(--text); }
  .radios { display:flex; gap:18px; flex-wrap:wrap; padding:4px 0; } .radios label { display:flex; align-items:center; gap:6px; font-size:14px; cursor:pointer; }
  .evh { display:flex; align-items:center; gap:12px; margin-bottom:6px; } .evh h3 { margin:0; font-size:20px; }
  .dot { width:14px; height:14px; border-radius:4px; flex:none; }
  .evr { display:flex; gap:14px; margin:12px 0; align-items:flex-start; font-size:14px; line-height:1.5; } .evr .ic { width:22px; text-align:center; flex:none; }
  .sub { color:var(--mute); font-size:13px; } .gst { margin:2px 0; font-size:13px; } a.lnk { color:var(--blue); }
  .optb { display:block; width:100%; text-align:left; border-radius:12px; padding:12px 14px; margin-bottom:10px; color:var(--text) !important; }
  .optb b { display:block; margin-bottom:2px; } .optb .sub { display:block; }
  #auth { display:none; position:fixed; inset:0; z-index:40; background:var(--bg); align-items:center; justify-content:center; padding:24px; text-align:center; }
  .authbox { background:var(--card); border-radius:16px; padding:28px; max-width:380px; box-shadow:0 2px 12px rgba(0,0,0,.25); }
  .authbox h2 { margin:0 0 8px; display:block; font-size:22px; letter-spacing:0; color:var(--text); } .authbox p { color:var(--mute); font-size:14px; margin:0 0 18px; }
  @keyframes rmmspin { to { transform:rotate(360deg); } }
  h2.othh { flex-wrap:nowrap; }
  h2.othh .hb { white-space:nowrap; flex:none; display:inline-flex; align-items:center; gap:4px; letter-spacing:0; }
  @media (max-width:600px) { h2.othh { gap:6px; letter-spacing:.04em; } h2.othh .hb { padding:6px 10px; min-width:40px; justify-content:center; } h2.othh .bl { display:none; } }
  .spin { width:44px; height:44px; border-radius:50%; border:5px solid var(--line); border-top-color:var(--blue); border-right-color:var(--red); border-bottom-color:var(--yellow); border-left-color:var(--green); animation:rmmspin .9s linear infinite; }
  .spin.sm { width:16px; height:16px; border-width:3px; display:none; }
  body.busy .spin.sm { display:inline-block; }
  body.busy #refBtn { opacity:.7; }
  #loader { display:none; position:fixed; inset:0; z-index:15; background:var(--bg); flex-direction:column; align-items:center; justify-content:center; gap:16px; color:var(--mute); font-size:14px; }
  #toast { position:fixed; bottom:84px; left:50%; transform:translateX(-50%); background:#323232; color:#fff; padding:10px 16px; border-radius:8px; font-size:13px; z-index:30; display:none; max-width:90%; text-align:center; }

  /* ---------- PC / skrin lebar: halaman STATIK ikut saiz browser, skrol dalam kotak sahaja ---------- */
  @media (min-width:1001px) {
    html, body { height:100%; overflow:hidden; }
    body { display:flex; flex-direction:column; }
    header { position:static; padding:12px 24px; flex:none; } #title { font-size:24px; }
    header small, .hs { display:inline; } header small { color:var(--mute); font-size:13px; }
    #shell { flex:1; min-height:0; display:flex; align-items:stretch; }
    #nav { position:static; flex-direction:column; justify-content:flex-start; width:152px; flex:none; background:transparent; border:0; padding:16px 0 16px 16px; gap:2px; }
    .nv { flex:none; flex-direction:row; gap:10px; padding:8px 12px; border-radius:18px; font-size:12px; letter-spacing:.05em; justify-content:flex-start; }
    .nv:hover { background:var(--card); } .nv .ic { width:20px; text-align:center; font-size:16px; }
    #shell.top { flex-direction:column; }
    #shell.top #nav { flex-direction:row; width:auto; overflow-x:auto; padding:12px 24px 0; gap:8px; }
    #shell.top .nv { background:var(--card); border:1px solid var(--line); }
    main { flex:1; min-width:0; min-height:0; display:grid; grid-template-columns:minmax(0,2.1fr) minmax(0,1fr); grid-template-rows:minmax(0,1fr); gap:16px; padding:16px 24px 16px 12px; }
    #shell.top main { padding-left:24px; }
    .left { display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr); grid-template-rows:minmax(0,2fr) minmax(0,3fr); gap:16px; min-height:0; min-width:0; }
    .col { display:flex; flex-direction:column; gap:16px; min-height:0; min-width:0; }
    .col section { flex:1 1 0; }
    .s-oth { grid-column:1 / -1; }
    section { padding:14px 16px; }
    section.imp { overflow:auto; }
    .list { flex:1; min-height:0; max-height:none; overflow:auto; }
    .arr { width:36px; height:36px; }
    #ov { align-items:center; padding:16px; } #modal { border-radius:14px; max-height:88vh; padding:22px; }
    .actions .btn { flex:0 0 auto; } .mframe { height:56vh; }
    #toast { bottom:20px; }
  }
</style>
</head>
<body>
<header>
  <div id="title"></div>
  <div class="hbtns"><span class="spin sm" id="hspin"></span><small id="upd"></small>
    <button class="btn ghost" id="inst" style="display:none" onclick="RMM.install()" title="Pasang app / Install app">⬇ App</button>
    <button class="btn ghost" onclick="openSettings()">⚙<span class="hs"> <span data-i="settings"></span></span></button>
    <button class="btn" id="refBtn" onclick="load()">↻<span class="hs"> <span data-i="refresh"></span></span></button>
  </div>
</header>

<div id="shell" class="side">
<nav id="nav"></nav>
<main>
  <div class="left">
    <section class="act s-act">
      <h2><span data-i="secAct"></span> <span class="n" id="nAct">0</span></h2>
      <div class="carousel">
        <button class="arr" id="aprev" onclick="stepA(-1)">‹</button>
        <div id="acard" class="mcard acard" onclick="openCurA()"></div>
        <button class="arr" id="anext" onclick="stepA(1)">›</button>
      </div>
      <div class="foot"><span class="cnt" id="acnt"></span>
        <span class="fbtns two">
          <button class="ibtn ok" id="aDone" onclick="doneCurA()" data-tip="tipDone"><span class="ib">✔</span><span data-i="lblDone"></span></button>
          <button class="ibtn del" id="aDel" onclick="delCurA()" data-tip="tipDel"><span class="ib">🗑</span><span data-i="lblDel"></span></button>
        </span></div>
    </section>
    <section class="imp s-imp">
      <h2><span data-i="secImp"></span> <span class="n" id="nImp">0</span></h2>
      <div class="carousel">
        <button class="arr" id="prev" onclick="step(-1)">‹</button>
        <div id="card" class="mcard" onclick="openCur()"></div>
        <button class="arr" id="next" onclick="step(1)">›</button>
      </div>
      <div class="foot"><span class="cnt" id="cnt"></span>
        <span class="fbtns">
          <button class="ibtn" id="actCur" onclick="actCur()" data-tip="tipAct"><span class="ib">⚑</span><span data-i="lblAct"></span></button>
          <button class="ibtn" id="lessCur" onclick="lessDlg()" data-tip="tipLess"><span class="ib">⬇</span><span data-i="lblLess"></span></button>
          <button class="ibtn del" id="delCur" onclick="delCur()" data-tip="tipDel"><span class="ib">🗑</span><span data-i="lblDel"></span></button>
        </span></div>
    </section>
    <section class="oth s-oth">
      <h2 class="othh"><input type="checkbox" id="all" onchange="selAll(this.checked)"><span data-i="secOth"></span> <span class="n" id="nOth">0</span>
        <span class="sp"></span>
        <button class="btn ghost sm hb" id="selAct" onclick="bulkAct()" disabled></button>
        <button class="btn ghost sm hb" id="selImp" onclick="bulkImp()" disabled></button>
        <button class="btn red sm hb" id="delSel" onclick="delSelected()" disabled></button></h2>
      <div id="othMail" class="list"></div>
    </section>
  </div>

  <div class="col">
    <section class="s-today">
      <h2><span data-i="secToday"></span> <span class="n" id="today"></span></h2>
      <div id="calToday" class="list"></div>
    </section>
    <section class="cal2 s-next">
      <h2 data-i="secNext"></h2>
      <div id="calNext" class="list"></div>
    </section>
    <section class="more s-more">
      <h2 data-i="secMore"></h2>
      <div id="calOther" class="list"></div>
    </section>
  </div>
</main>
</div>

<div id="loader"><div class="spin"></div><div id="loaderTxt"></div></div>
<div id="auth"><div class="authbox"><h2 id="authTitle">Read My Mail</h2><p id="authMsg"></p><button class="btn" id="authBtn" onclick="RMM.signIn()"></button></div></div>
<div id="toast"></div>
<div id="ov" onclick="if(event.target===this)closeM()"><div id="modal"></div></div>

<script src="config.js"></script>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<script src="app-api.js"></script>

    DATA.events.forEach(function (e, i) {
      var other = e.status === 'NO' || e.status === 'MAYBE';
      if (!other && dayIdx(e) === 0) A += evHtml(e, i, false);
      else if (!other && e.important) N += evHtml(e, i, true);
      else O += evHtml(e, i, true);
    });
    $('calToday').innerHTML = A || '<div class="empty">' + t('noToday') + '</div>';
    $('calNext').innerHTML = N || '<div class="empty">' + t('noNext') + '</div>';
    $('calOther').innerHTML = O || '<div class="empty">' + t('none') + '</div>';
    $('today').textContent = new Date().toLocaleDateString(loc(), { weekday:'short', day:'numeric', month:'short' });
  }
  function evWhen(e) {
    var s0 = new Date(e.start), en = new Date(e.end), o = { weekday:'long', day:'numeric', month:'long' };
    if (e.allDay) {
      var last = new Date(en.getTime() - 1), a = s0.toLocaleDateString(loc(), o);
      return s0.toDateString() === last.toDateString() ? a + '<br><span class="sub">' + t('allDay') + '</span>' : a + ' – ' + last.toLocaleDateString(loc(), o);
    }
    if (s0.toDateString() === en.toDateString()) return s0.toLocaleDateString(loc(), o) + '<br><span class="sub">' + fT(e.start) + ' – ' + fT(e.end) + '</span>';
    return s0.toLocaleDateString(loc(), o) + ', ' + fT(e.start) + ' –<br>' + en.toLocaleDateString(loc(), o) + ', ' + fT(e.end);
  }
  function urlOf(x) { var m = String(x || '').match(/https?:\/\/[^\s"'<>]+/); return m ? m[0] : ''; }
  function openEvent(i) {
    var e = DATA.events[i];
    var join = e.join || [e.location, e.descHtml].map(urlOf).filter(function (u) { return /meet\.google\.com|zoom\.us|teams\.microsoft\.com|webex\.com/.test(u); })[0] || '';
    var locU = urlOf(e.location);
    var locH = e.location ? '<div class="evr"><span class="ic">📍</span><div><a class="lnk" target="_blank" href="' + esc(locU || 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(e.location)) + '">' + esc(e.location) + '</a></div></div>' : '';
    var guests = (e.guestList || []).map(function (g) {
      return '<div class="gst">' + esc(g.name || g.email) + (g.name ? ' <span class="sub">' + esc(g.email) + '</span>' : '') + ' <span class="tag ' + g.status + '">' + t('st' + g.status) + '</span></div>';
    }).join('');
    var plain = (e.descHtml || '').replace(/<[^>]*>|&nbsp;/g, '').trim();
    var descH = plain ? '<div class="evr"><span class="ic">📄</span><iframe class="mframe" style="height:' + Math.min(320, 70 + Math.ceil(plain.length / 70) * 20) + 'px;margin:0" sandbox="allow-popups allow-popups-to-escape-sandbox" srcdoc="' + attr(mailDoc({ html: e.descHtml, body: '' })) + '"></iframe></div>' : '';
    showM('<div class="evh"><span class="dot" style="background:' + (e.important ? 'var(--red)' : 'var(--blue)') + '"></span><h3>' + esc(e.title) + '</h3></div>' +
      '<div class="evr"><span class="ic">🕒</span><div>' + evWhen(e) + '</div></div>' +
      (join ? '<div class="evr"><span class="ic">🎥</span><div><a class="btn sm" target="_blank" href="' + esc(join) + '">' + t('join') + '</a></div></div>' : '') +
      locH +
      (guests ? '<div class="evr"><span class="ic">👥</span><div><b>' + t('guestsN', { n: e.guestList.length }) + '</b>' + guests + '</div></div>' : '') +
      (e.creators ? '<div class="evr"><span class="ic">👤</span><div><span class="sub">' + t('organizer') + '</span><br>' + esc(e.creators) + '</div></div>' : '') +
      descH +
      '<div class="evr"><span class="ic">☑️</span><div><span class="sub">' + t('status') + '</span><br><span class="tag ' + e.status + '" style="margin:0">' + t('st' + e.status) + '</span></div></div>' +
      '<div class="actions"><a class="btn" href="' + esc(e.link) + '" target="_blank">' + t('openCal') + '</a><button class="btn ghost" onclick="closeM()">' + t('close') + '</button></div>');
  }

  // ===== TETAPAN =====
  function fld(label, id, arr) { return '<label class="lbl">' + label + '</label><textarea id="' + id + '" rows="3">' + esc((arr || []).join('\n')) + '</textarea>'; }
  function radios(name, cur, opts) {
    return '<div class="radios">' + opts.map(function (o) {
      return '<label><input type="radio" name="' + name + '" value="' + o[0] + '"' + (o[0] === cur ? ' checked' : '') + '> ' + o[1] + '</label>';
    }).join('') + '</div>';
  }
  function rv(name) { var e = document.querySelector('input[name=' + name + ']:checked'); return e ? e.value : ''; }
  function openSettings() {
    var s = DATA.settings || {};
    showM('<h3>' + t('setTitle') + '</h3><div class="meta">' + t('setNote') + '</div>' +
      '<label class="lbl">' + t('fLang') + '</label>' + radios('sLang', s.lang || 'en', [['ms', 'Bahasa Melayu'], ['en', 'English']]) +
      '<label class="lbl">' + t('fTheme') + '</label>' + radios('sTheme', s.theme || 'system', [['system', t('thSys')], ['light', t('thLight')], ['dark', t('thDark')]]) +
      '<label class="lbl">' + t('fNavPos') + '</label>' + radios('sNav', s.navPos || 'side', [['side', t('navSide')], ['top', t('navTop')]]) +
      (ANDROID ? '<label class="lbl">' + t('fOpen') + '</label>' + radios('sOpen', cached('rmm_open', 'app'), [['app', t('openApp')], ['web', t('openWeb')]]) : '') +
      '<label class="lbl">' + t('fAuto') + '</label>' + radios('sAuto', s.autoDemote ? 'move' : 'keep', [['keep', t('autoKeep')], ['move', t('autoMove')]]) +
      fld(t('fVip'), 'sVip', s.vip) + fld(t('fKw'), 'sKw', s.keywords) + fld(t('fMute'), 'sMute', s.muted) +
      fld(t('fAct'), 'sAct', s.actionWords) + fld(t('fMeet'), 'sMeet', s.meetingWords) + fld(t('fEv'), 'sEv', s.eventKeywords) +
      '<label class="lbl">' + t('fRef') + '</label><input id="sRef" type="number" min="30" max="600" value="' + (s.refresh || 60) + '">' +
      '<label class="lbl">' + t('fDays') + '</label><input id="sDays" type="number" min="1" max="30" value="' + (s.days || 7) + '">' +
      '<div class="actions" style="margin-top:14px"><button class="btn" onclick="saveSet()">' + t('save') + '</button><button class="btn ghost" onclick="resetSet()">' + t('resetLists') + '</button><button class="btn ghost" onclick="RMM.signOut()">' + t('signOut') + '</button><button class="btn ghost" onclick="closeM()">' + t('cancel') + '</button></div>');
  }
  function saveSet() {
    var L = function (id) { return $(id).value.split(/\n|,/).map(function (x) { return x.trim(); }).filter(Boolean); };
    var data = { vip:L('sVip'), keywords:L('sKw'), muted:L('sMute'), actionWords:L('sAct'), meetingWords:L('sMeet'), eventKeywords:L('sEv'),
                 refresh:$('sRef').value, days:$('sDays').value, lang:rv('sLang'), theme:rv('sTheme'), navPos:rv('sNav'), autoDemote:rv('sAuto') === 'move' };
    if (rv('sOpen')) { try { localStorage.setItem('rmm_open', rv('sOpen')); } catch (e) {} }
    showM('<h3>' + t('saving') + '</h3>');
    RMM.run.withSuccessHandler(function (st) { DATA.settings = st; applyPrefs(); closeM(); load(); })
      .withFailureHandler(function (e) { closeM(); fail(e); }).saveSettings(data);
  }
  function resetSet() {
    RMM.run.withSuccessHandler(function (st) { DATA.settings = st; closeM(); load(); toast(t('toastReset')); })
      .withFailureHandler(function (e) { closeM(); fail(e); }).resetLists();
  }

  // ===== BUTANG PINTASAN: INBOX, SENT, CALENDAR, DRIVE, GEMINI =====
  // Android: cuba buka apl Google (kembali ke web jika apl tiada). iPhone/PC: pautan web biasa.
  function renderNav() {
    var me = encodeURIComponent(DATA.me || ''), g = 'https://mail.google.com/mail/?authuser=' + me + '#';
    var items = [
      ['📧', 'GMAIL',    g + 'inbox',  'mail.google.com',     '/mail/',     'com.google.android.gm', 1],
      ['📅', 'CALENDAR', 'https://calendar.google.com/calendar/r?authuser=' + me, 'calendar.google.com', '/calendar/', 'com.google.android.calendar'],
      ['☁️', 'DRIVE',    'https://drive.google.com/drive/my-drive?authuser=' + me, 'drive.google.com', '/drive/', 'com.google.android.apps.docs'],
      ['✨', 'GEMINI',   'https://gemini.google.com/app?authuser=' + me, 'gemini.google.com', '/app', 'com.google.android.apps.bard', 1]
    ];
    $('nav').innerHTML = items.map(function (x) {
      var fb = ';S.browser_fallback_url=' + encodeURIComponent(x[2]) + ';end';
      // Gmail & Gemini tidak mengendalikan pautan web https -> buka app melalui 'launcher intent'.
      // Calendar & Drive memang mengendalikan pautan web, jadi kekal guna pautan.
      var href = !appMode() ? x[2]
        : x[6] ? launcher(x[5], x[2])
        : 'intent://' + x[3] + x[4] + '#Intent;scheme=https;package=' + x[5] + fb;
      return '<a class="nv" href="' + esc(href) + '" target="' + tgt() + '" rel="noopener"><span class="ic">' + x[0] + '</span><span>' + x[1] + '</span></a>';
    }).join('');
  }

  // ===== UMUM =====
  function render() {
    applyPrefs();
    var valid = {}; DATA.emails.forEach(function (m) { valid[m.id] = 1; });
    Object.keys(sel).forEach(function (k) { if (!valid[k]) delete sel[k]; });
    renderAct(); renderImp(); renderOth(); renderCal(); renderNav();
    $('upd').textContent = t('updated') + ' ' + fT(DATA.updated);
  }
  function showM(h) { $('modal').innerHTML = h; $('ov').style.display = 'flex'; }
  function closeM() { $('ov').style.display = 'none'; }
  function toast(m) {
    var e = $('toast'); e.textContent = m; e.style.display = 'block';
    clearTimeout(window._tt); window._tt = setTimeout(function () { e.style.display = 'none'; }, 6000);
  }
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') closeM();
    else if ($('ov').style.display !== 'flex' && !/INPUT|TEXTAREA|SELECT/.test((e.target || {}).tagName || '')) {
      var st = focusCar === 'act' ? stepA : step, idx = focusCar === 'act' ? actIdx : impIdx;
      if (e.key === 'ArrowLeft' && idx > 0) st(-1); if (e.key === 'ArrowRight') st(1);
    }
  });

  document.documentElement.setAttribute('data-theme', cached('rmm_theme', 'system'));
  applyLang();
  window.addEventListener('load', function () { load(); });
  (function tick() {
    setTimeout(function () { if (!document.hidden && $('ov').style.display !== 'flex' && $('auth').style.display !== 'flex') load(); tick(); },
      ((DATA.settings && DATA.settings.refresh) || 60) * 1000);
  })();
  // Swipe kiri/kanan pada kad (telefon) + ingat carousel yang terakhir disentuh untuk papan kekunci
  function swipeCard(card, which, len, go, idx) {
    var x0 = null;
    card.parentNode.parentNode.addEventListener('pointerdown', function () { focusCar = which; });
    card.parentNode.parentNode.addEventListener('mouseenter', function () { focusCar = which; });
    card.addEventListener('touchstart', function (e) { x0 = e.touches[0].clientX; }, { passive:true });
    card.addEventListener('touchend', function (e) {
      if (x0 === null) return;
      var dx = e.changedTouches[0].clientX - x0; x0 = null;
      if (dx < -50 && idx() < len() - 1) go(1); else if (dx > 50 && idx() > 0) go(-1);
    });
  }
  swipeCard($('card'), 'imp', function () { return impList().length; }, step, function () { return impIdx; });
  swipeCard($('acard'), 'act', function () { return actList().length; }, stepA, function () { return actIdx; });
</script>
<script>if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(function () {});</script>
</body>
